name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scompatta lo zip e trova il progetto
        run: |
          if [ -f PromptBox.zip ]; then unzip -q -o PromptBox.zip -d _unz; fi
          F=$(find . -name settings.gradle.kts -not -path './.git/*' -print -quit)
          echo "PROJECT_DIR=$(dirname "$F")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compila
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PromptBox-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
