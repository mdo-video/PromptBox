name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scompatta lo zip e trova il progetto
        run: |
          if [ -f PromptBox.zip ]; then unzip -q -o PromptBox.zip -d _unz; fi
          F=$(find . -name settings.gradle.kts -not -path './.git/*' -print -quit)
          echo "PROJECT_DIR=$(dirname "$F")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accetta licenze Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compila
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon

      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" PromptBox.apk
          gh release create "v${{ github.run_number }}" PromptBox.apk \
            --title "PromptBox ${{ github.run_number }}" \
            --notes "Build automatica"
